name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Linux
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, untagged
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build rtk
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          # The binary links the BUSL-1.1 rtk-engine, so both texts travel
          # with every artifact: LICENSE (Apache-2.0, the CLI sources) and
          # LICENSE-ENGINE (BUSL-1.1, the linked engine).
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../rtk-${{ matrix.target }}.${{ matrix.archive }} rtk LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          7z a ../../../rtk-${{ matrix.target }}.${{ matrix.archive }} rtk.exe LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rtk-${{ matrix.target }}
          path: rtk-${{ matrix.target }}.${{ matrix.archive }}

      # The Apache-2.0 edition: the same binary built without the BUSL engine,
      # so only LICENSE travels with it. Same binary name `rtk` inside -- an
      # installed hook command must keep working across editions.
      - name: Build rtk (Apache-2.0 edition)
        run: cargo build --release --no-default-features --target ${{ matrix.target }}
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Package rtk-oss (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../rtk-oss-${{ matrix.target }}.${{ matrix.archive }} rtk LICENSE
          cd ../../..

      - name: Package rtk-oss (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp LICENSE target/${{ matrix.target }}/release/LICENSE
          cd target/${{ matrix.target }}/release
          7z a ../../../rtk-oss-${{ matrix.target }}.${{ matrix.archive }} rtk.exe LICENSE
          cd ../../..

      - name: Upload rtk-oss artifact
        uses: actions/upload-artifact@v7
        with:
          name: rtk-oss-${{ matrix.target }}
          path: rtk-oss-${{ matrix.target }}.${{ matrix.archive }}

      # The daemon ships as its own archive rather than inside the rtk one.
      # It is licensed BUSL-1.1, not Apache-2.0, so bundling it would hand
      # every rtk user a binary under different terms without them choosing
      # it. The BSL requires its text to travel with the work, hence the
      # LICENSE alongside the binary, plus LICENSE-ENGINE for the rtk-engine
      # crate the daemon links.
      #
      # `--target-dir target` keeps the output where the packaging steps look:
      # proxy/ is not a workspace member, so its default target dir would be
      # proxy/target/.
      - name: Build rtk-proxy
        id: build_proxy
        run: >
          cargo build --release
          --manifest-path proxy/Cargo.toml
          --target-dir target
          --target ${{ matrix.target }}
        env:
          CFLAGS_x86_64_unknown_linux_musl: "-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t"

      - name: Package rtk-proxy (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp proxy/LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../rtk-proxy-${{ matrix.target }}.${{ matrix.archive }} rtk-proxy LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Package rtk-proxy (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cp proxy/LICENSE target/${{ matrix.target }}/release/LICENSE
          cp engine/LICENSE target/${{ matrix.target }}/release/LICENSE-ENGINE
          cd target/${{ matrix.target }}/release
          7z a ../../../rtk-proxy-${{ matrix.target }}.${{ matrix.archive }} rtk-proxy.exe LICENSE LICENSE-ENGINE
          cd ../../..

      - name: Upload rtk-proxy artifact
        uses: actions/upload-artifact@v7
        with:
          name: rtk-proxy-${{ matrix.target }}
          path: rtk-proxy-${{ matrix.target }}.${{ matrix.archive }}

  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, untagged

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build DEB
        run: cargo deb
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: rtk-deb
          path: target/debian/*.deb

  build-deb-oss:
    name: Build DEB package (Apache-2.0 edition)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build DEB
        run: cargo deb --variant oss -- --no-default-features
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: rtk-oss-deb
          path: target/debian/*.deb

  build-rpm-oss:
    name: Build RPM package (Apache-2.0 edition)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          dnf install -y rust cargo rpm-build

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build release
        run: cargo build --release --no-default-features
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Generate RPM
        run: cargo generate-rpm --variant oss

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: rtk-oss-rpm
          path: target/generate-rpm/*.rpm

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          dnf install -y rust cargo rpm-build

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build release
        run: cargo build --release
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Generate RPM
        run: cargo generate-rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: rtk-rpm
          path: target/generate-rpm/*.rpm

  release:
    name: Create Release
    needs: [build, build-deb, build-rpm, build-deb-oss, build-rpm-oss]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;

      # Stable download names. Match each edition explicitly: a bare *.deb
      # glob would copy both editions over one name and drop the other.
      - name: Create version-agnostic package names
        run: |
          cd release
          for f in rtk_*.deb;     do [ -f "$f" ] && cp "$f" "rtk_amd64.deb"; done
          for f in rtk-oss_*.deb; do [ -f "$f" ] && cp "$f" "rtk-oss_amd64.deb"; done
          for f in rtk-[0-9]*.rpm;   do [ -f "$f" ] && cp "$f" "rtk.x86_64.rpm"; done
          for f in rtk-oss-[0-9]*.rpm; do [ -f "$f" ] && cp "$f" "rtk-oss.x86_64.rpm"; done

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: release/*
          prerelease: ${{ inputs.prerelease }}
          token: ${{ steps.app-token.outputs.token }}

  desktop-plugin:
    name: Claude Desktop plugin
    needs: [build, release]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download the Linux musl rtk of this release
        uses: actions/download-artifact@v4
        with:
          name: rtk-x86_64-unknown-linux-musl
          path: musl

      - name: Unpack rtk
        run: |
          mkdir -p musl/bin
          tar -xzf musl/rtk-x86_64-unknown-linux-musl.tar.gz -C musl/bin rtk
          musl/bin/rtk --version

      - name: Test the service
        run: cd desktop-plugin/desktop-src && node --test test/

      - name: Test the hooks against this rtk
        run: RTK_BIN="$PWD/musl/bin/rtk" python3 desktop-plugin/test_hooks.py

      - name: Build the plugin zip
        run: sh desktop-plugin/build.sh --version "${{ steps.version.outputs.version }}" --rtk musl/bin/rtk --out desktop-plugin/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rtk-desktop-plugin
          path: desktop-plugin/dist/rtk-desktop-plugin-*.zip

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Add the plugin to the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          ZIP=$(ls desktop-plugin/dist/rtk-desktop-plugin-*.zip)
          NAME=$(basename "$ZIP")
          cp "$ZIP" desktop-plugin/dist/rtk-desktop-plugin.zip
          gh release upload "$TAG" "$ZIP" desktop-plugin/dist/rtk-desktop-plugin.zip --repo "$REPO" --clobber
          gh release download "$TAG" --repo "$REPO" --pattern checksums.txt --output checksums.txt --clobber
          grep -v "[[:space:]]rtk-desktop-plugin" checksums.txt > checksums.new || true
          (cd desktop-plugin/dist && sha256sum "$NAME" rtk-desktop-plugin.zip) >> checksums.new
          mv checksums.new checksums.txt
          gh release upload "$TAG" checksums.txt --repo "$REPO" --clobber

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: ${{ !inputs.prerelease }}
        id: marketplace-token
        continue-on-error: true
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: rtk-ai
          repositories: claude-plugins
          permission-contents: write

      - name: Publish to the plugin marketplace
        if: ${{ !inputs.prerelease }}
        env:
          TOKEN: ${{ steps.marketplace-token.outputs.token }}
          APP_SLUG: ${{ steps.marketplace-token.outputs.app-slug }}
          VERSION: ${{ steps.version.outputs.version }}
          MARKETPLACE_REPO: rtk-ai/claude-plugins
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::no token for $MARKETPLACE_REPO (is the GitHub App installed on it?): the marketplace was not updated"
            exit 0
          fi
          git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/${MARKETPLACE_REPO}.git" marketplace
          rm -rf marketplace/plugins/rtk
          mkdir -p marketplace/plugins marketplace/.claude-plugin
          cp -R desktop-plugin/dist/rtk marketplace/plugins/rtk
          cp desktop-plugin/marketplace/marketplace.json marketplace/.claude-plugin/marketplace.json
          cp desktop-plugin/marketplace/README.md marketplace/README.md
          cd marketplace
          bot="${APP_SLUG:-rtk-release-bot}[bot]"
          bot_id=$(GH_TOKEN="$TOKEN" gh api "/users/${bot}" --jq .id 2>/dev/null || true)
          git config user.name "$bot"
          git config user.email "${bot_id:+${bot_id}+}${bot}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "marketplace already at $VERSION"
          else
            git commit --quiet -m "rtk $VERSION"
            git push --quiet origin HEAD
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: failure()
        id: issue-token
        continue-on-error: true
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.issue-token.outputs.token }}
          DISCORD_WEBHOOK: ${{ secrets.RTK_DISCORD_RELEASE }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error title=Claude Desktop plugin::The plugin was not built or published for $TAG. The release itself is unaffected; fix desktop-plugin/ before the next release. $RUN_URL"
          TITLE="Claude Desktop plugin build failed"
          BODY="The \`desktop-plugin\` job failed for release \`$TAG\`: $RUN_URL

          The release itself is published without \`rtk-desktop-plugin-*.zip\`. Users of the Desktop plugin stay on their previous version until this is fixed and a release ships it again."
          if [ -n "$GH_TOKEN" ]; then
            EXISTING=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty' || true)
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY" || echo "::warning::could not comment issue #$EXISTING"
            else
              gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || echo "::warning::could not open the issue"
            fi
          else
            echo "::warning::no token with issues permission; the issue was not opened"
          fi
          if [ -n "$DISCORD_WEBHOOK" ]; then
            jq -n --arg title "Claude Desktop plugin build FAILED for $TAG" --arg url "$RUN_URL" \
              --arg desc "The rtk release is published, but without the Desktop plugin zip. Fix desktop-plugin/ before the next release." \
              '{embeds: [{title: $title, url: $url, description: $desc, color: 15158332, footer: {text: "Rust Token Killer"}}]}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" || echo "::warning::Discord notification failed"
          fi

  notify-discord:
    name: Notify Discord
    needs: [release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.RTK_DISCORD_RELEASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_URL="https://github.com/rtk-ai/rtk/releases/tag/${TAG}"

          # Fetch release notes from GitHub API
          NOTES=$(gh api "repos/rtk-ai/rtk/releases/tags/${TAG}" --jq '.body' 2>/dev/null | head -c 1800 || echo "")
          DESC=$(echo "${NOTES:-No release notes}" | jq -Rs .)

          jq -n \
            --arg title "RTK ${TAG} released" \
            --arg url "$RELEASE_URL" \
            --argjson desc "$DESC" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 5814783, footer: {text: "Rust Token Killer"}}]}' \
          | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

  homebrew:
    name: Update Homebrew formula
    needs: [release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download checksums
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo rtk-ai/rtk \
            --pattern checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse checksums
        id: sha
        run: |
          echo "mac_arm=$(grep "[[:space:]]rtk-aarch64-apple-darwin.tar.gz\$" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "mac_intel=$(grep "[[:space:]]rtk-x86_64-apple-darwin.tar.gz\$" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm=$(grep "[[:space:]]rtk-aarch64-unknown-linux-gnu.tar.gz\$" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_intel=$(grep "[[:space:]]rtk-x86_64-unknown-linux-musl.tar.gz\$" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "oss_mac_arm=$(grep "[[:space:]]rtk-oss-aarch64-apple-darwin.tar.gz\$" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "oss_mac_intel=$(grep "[[:space:]]rtk-oss-x86_64-apple-darwin.tar.gz\$" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "oss_linux_arm=$(grep "[[:space:]]rtk-oss-aarch64-unknown-linux-gnu.tar.gz\$" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "oss_linux_intel=$(grep "[[:space:]]rtk-oss-x86_64-unknown-linux-musl.tar.gz\$" checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Generate formula
        run: |
          cat > rtk.rb << 'FORMULA'
          class Rtk < Formula
            desc "Rust Token Killer - High-performance CLI proxy to minimize LLM token consumption"
            homepage "https://www.rtk-ai.app"
            version "VERSION_PLACEHOLDER"
            license all_of: ["Apache-2.0", "BUSL-1.1"]

            conflicts_with "rtk-oss", because: "both install the rtk binary"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/rtk-ai/rtk/releases/download/TAG_PLACEHOLDER/rtk-aarch64-apple-darwin.tar.gz"
              sha256 "SHA_MAC_ARM_PLACEHOLDER"
            elsif OS.mac? && Hardware::CPU.intel?
              url "https://github.com/rtk-ai/rtk/releases/download/TAG_PLACEHOLDER/rtk-x86_64-apple-darwin.tar.gz"
              sha256 "SHA_MAC_INTEL_PLACEHOLDER"
            elsif OS.linux? && Hardware::CPU.arm?
              url "https://github.com/rtk-ai/rtk/releases/download/TAG_PLACEHOLDER/rtk-aarch64-unknown-linux-gnu.tar.gz"
              sha256 "SHA_LINUX_ARM_PLACEHOLDER"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/rtk-ai/rtk/releases/download/TAG_PLACEHOLDER/rtk-x86_64-unknown-linux-musl.tar.gz"
              sha256 "SHA_LINUX_INTEL_PLACEHOLDER"
            end

            def install
              bin.install "rtk"
            end

            def caveats
              <<~EOS
                rtk is installed! Get started:

                  # Initialize for Claude Code
                  rtk init -g          # Global hook-first setup (recommended)
                  rtk init             # Add to ./CLAUDE.md (this project only)

                  # See all commands
                  rtk --help

                  # Measure your token savings
                  rtk gain

                Full documentation: https://www.rtk-ai.app
              EOS
            end

            test do
              system "#{bin}/rtk", "--version"
            end
          end
          FORMULA
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/g" rtk.rb
          sed -i "s/TAG_PLACEHOLDER/${{ steps.version.outputs.tag }}/g" rtk.rb
          sed -i "s/SHA_MAC_ARM_PLACEHOLDER/${{ steps.sha.outputs.mac_arm }}/g" rtk.rb
          sed -i "s/SHA_MAC_INTEL_PLACEHOLDER/${{ steps.sha.outputs.mac_intel }}/g" rtk.rb
          sed -i "s/SHA_LINUX_ARM_PLACEHOLDER/${{ steps.sha.outputs.linux_arm }}/g" rtk.rb
          sed -i "s/SHA_LINUX_INTEL_PLACEHOLDER/${{ steps.sha.outputs.linux_intel }}/g" rtk.rb
          # Remove leading spaces from heredoc
          sed -i 's/^          //' rtk.rb

      # Second formula for the Apache-2.0 edition. Class name RtkOss maps to
      # Formula/rtk-oss.rb, installed as `brew install rtk-ai/tap/rtk-oss`.
      # It provides the same `rtk` binary, so it conflicts with the full one.
      - name: Generate formula (Apache-2.0 edition)
        run: |
          cat > rtk-oss.rb << 'FORMULA'
          class RtkOss < Formula
            desc "Rust Token Killer - Apache-2.0 edition: hook rewrite and command filters"
            homepage "https://www.rtk-ai.app"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            conflicts_with "rtk", because: "both install the rtk binary"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/rtk-ai/rtk/releases/download/TAG_PLACEHOLDER/rtk-oss-aarch64-apple-darwin.tar.gz"
              sha256 "SHA_OSS_MAC_ARM_PLACEHOLDER"
            elsif OS.mac? && Hardware::CPU.intel?
              url "https://github.com/rtk-ai/rtk/releases/download/TAG_PLACEHOLDER/rtk-oss-x86_64-apple-darwin.tar.gz"
              sha256 "SHA_OSS_MAC_INTEL_PLACEHOLDER"
            elsif OS.linux? && Hardware::CPU.arm?
              url "https://github.com/rtk-ai/rtk/releases/download/TAG_PLACEHOLDER/rtk-oss-aarch64-unknown-linux-gnu.tar.gz"
              sha256 "SHA_OSS_LINUX_ARM_PLACEHOLDER"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/rtk-ai/rtk/releases/download/TAG_PLACEHOLDER/rtk-oss-x86_64-unknown-linux-musl.tar.gz"
              sha256 "SHA_OSS_LINUX_INTEL_PLACEHOLDER"
            end

            def install
              bin.install "rtk"
            end

            test do
              system "#{bin}/rtk", "--version"
            end
          end
          FORMULA
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/g" rtk-oss.rb
          sed -i "s/TAG_PLACEHOLDER/${{ steps.version.outputs.tag }}/g" rtk-oss.rb
          sed -i "s/SHA_OSS_MAC_ARM_PLACEHOLDER/${{ steps.sha.outputs.oss_mac_arm }}/g" rtk-oss.rb
          sed -i "s/SHA_OSS_MAC_INTEL_PLACEHOLDER/${{ steps.sha.outputs.oss_mac_intel }}/g" rtk-oss.rb
          sed -i "s/SHA_OSS_LINUX_ARM_PLACEHOLDER/${{ steps.sha.outputs.oss_linux_arm }}/g" rtk-oss.rb
          sed -i "s/SHA_OSS_LINUX_INTEL_PLACEHOLDER/${{ steps.sha.outputs.oss_linux_intel }}/g" rtk-oss.rb
          sed -i 's/^          //' rtk-oss.rb

      - name: Push to homebrew-tap
        run: |
          for f in rtk rtk-oss; do
            CONTENT=$(base64 -w 0 "$f.rb")
            SHA=$(gh api "repos/rtk-ai/homebrew-tap/contents/Formula/$f.rb" --jq '.sha' 2>/dev/null || echo "")
            if [ -n "$SHA" ]; then
              gh api -X PUT "repos/rtk-ai/homebrew-tap/contents/Formula/$f.rb" \
                -f message="$f ${{ steps.version.outputs.version }}" \
                -f content="$CONTENT" \
                -f sha="$SHA"
            else
              gh api -X PUT "repos/rtk-ai/homebrew-tap/contents/Formula/$f.rb" \
                -f message="$f ${{ steps.version.outputs.version }}" \
                -f content="$CONTENT"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  winget:
    name: Update winget manifest
    needs: [release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    # A failed submission must not fail the release workflow: cd.yml gates
    # update-latest-tag on build-release, so a red job here would leave the
    # 'latest' tag on the previous version.
    continue-on-error: true
    steps:
      - name: Get version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Pinned to a main commit, not the v2 tag: v2 has not moved since 2024-11-27
      # and is four fixes behind, including cargo binstall on ubuntu-slim runners.
      - uses: vedantmgoyal9/winget-releaser@a43926ed822e5a076ac8a81e0a794915cbad51d1 # 2026-03-14
        with:
          identifier: rtk-ai.rtk
          version: ${{ steps.version.outputs.version }}
          installers-regex: 'rtk-x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: ${{ steps.version.outputs.tag }}
