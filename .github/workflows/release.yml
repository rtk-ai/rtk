name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../rtk-${{ matrix.target }}.${{ matrix.archive }} rtk
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../rtk-${{ matrix.target }}.${{ matrix.archive }} rtk.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-${{ matrix.target }}
          path: rtk-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;

      - name: Create checksums
        run: |
          cd release
          sha256sum ./* > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: release/*
          prerelease: ${{ inputs.prerelease }}
          token: ${{ steps.app-token.outputs.token }}

  update-formula:
    name: Update Homebrew formula on homeserve/main
    needs: [release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout homeserve/main
        uses: actions/checkout@v4
        with:
          ref: homeserve/main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.version.outputs.tag }}" --pattern checksums.txt

      - name: Parse checksums
        id: sha
        run: |
          INTEL=$(grep x86_64-apple-darwin.tar.gz checksums.txt | head -1 | awk '{print $1}')
          ARM=$(grep aarch64-apple-darwin.tar.gz checksums.txt | head -1 | awk '{print $1}')
          LINUX=$(grep x86_64-unknown-linux-musl.tar.gz checksums.txt | head -1 | awk '{print $1}')
          if [ -z "$INTEL" ] || [ -z "$ARM" ] || [ -z "$LINUX" ]; then
            echo "::error::Failed to parse checksums for macOS or Linux targets"
            exit 1
          fi
          echo "intel=$INTEL" >> "$GITHUB_OUTPUT"
          echo "arm=$ARM" >> "$GITHUB_OUTPUT"
          echo "linux=$LINUX" >> "$GITHUB_OUTPUT"

      - name: Regenerate Formula/rtk.rb
        run: |
          mkdir -p Formula
          cat > Formula/rtk.rb << 'EOF'
          # typed: false
          # frozen_string_literal: true

          # Homebrew formula for rtk - Rust Token Killer (Homeserve mirror)
          # To install:
          #   brew tap homeservefr/rtk https://github.com/HomeserveFR/rtk.git
          #   brew install homeservefr/rtk/rtk
          class Rtk < Formula
            desc "High-performance CLI proxy to minimize LLM token consumption"
            homepage "https://github.com/HomeserveFR/rtk"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/HomeserveFR/rtk/releases/download/v#{version}/rtk-x86_64-apple-darwin.tar.gz"
                sha256 "INTEL_PLACEHOLDER"
              end

              on_arm do
                url "https://github.com/HomeserveFR/rtk/releases/download/v#{version}/rtk-aarch64-apple-darwin.tar.gz"
                sha256 "ARM_PLACEHOLDER"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/HomeserveFR/rtk/releases/download/v#{version}/rtk-x86_64-unknown-linux-musl.tar.gz"
                sha256 "LINUX_PLACEHOLDER"
              end
            end

            def install
              bin.install "rtk"
            end

            test do
              assert_match "rtk #{version}", shell_output("#{bin}/rtk --version")
            end
          end
          EOF
          sed -i 's/^          //' Formula/rtk.rb
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/" Formula/rtk.rb
          sed -i "s/INTEL_PLACEHOLDER/${{ steps.sha.outputs.intel }}/" Formula/rtk.rb
          sed -i "s/ARM_PLACEHOLDER/${{ steps.sha.outputs.arm }}/" Formula/rtk.rb
          sed -i "s/LINUX_PLACEHOLDER/${{ steps.sha.outputs.linux }}/" Formula/rtk.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/rtk.rb; then
            echo "Formula already up to date for ${{ steps.version.outputs.tag }}"
            exit 0
          fi
          git add Formula/rtk.rb
          git commit -m "chore(formula): update rtk to ${{ steps.version.outputs.version }}"
          git push origin homeserve/main
