name: CD (pre-release)

on:
  workflow_dispatch:
  push:
    branches: [develop]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pre-release:
    # workflow_dispatch can be aimed at any ref, and master must never take
    # this path -- its releases are cut by stable-release.yml.
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect build-input changes
        id: scope
        run: |
          # Against the last RC, not github.event.before: develop runs are
          # cancel-in-progress, and a docs push landing on a cancelled source
          # build would diff only its own commits and skip, stranding that
          # source change with no RC.
          LAST_RC=$(git tag -l 'dev-*-rc.*' --sort=-creatordate | head -1)
          if [ -z "$LAST_RC" ]; then
            echo "::notice::No previous RC tag - building unconditionally"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rc=0
          bash .github/scripts/changed-scope.sh "$LAST_RC" HEAD || rc=$?
          # Only status 3 means inert; bash's own failure statuses build.
          if [ "$rc" -eq 3 ]; then BUILD=false; else BUILD=true; fi
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

          if [ "$BUILD" = "false" ]; then
            echo "::notice::Nothing but inert paths since ${LAST_RC} - skipping pre-release"
            {
              echo "### Pre-release skipped"
              echo ""
              echo "Nothing outside \`.github/inert-paths.conf\` changed since \`${LAST_RC}\`."
              echo '```'
              git diff --no-renames --name-only "$LAST_RC" HEAD
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Leaving `tag` unset is the whole gate: build-prerelease already carries
      # `if: tag != ''`, so the 5 platform builds + DEB + RPM + Create Release
      # skip without touching the job graph.
      - name: Compute version from commits like release please
        id: tag
        if: steps.scope.outputs.build == 'true'
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -v '-' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No stable release tag found"
            exit 1
          fi
          LATEST_VERSION="${LATEST_TAG#v}"
          echo "Latest release: $LATEST_TAG"

          # ── Analyse conventional commits since that tag ──
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s")
          HAS_BREAKING=$(echo "$COMMITS" | grep -cE '^[a-z]+(\(.+\))?!:' || true)
          HAS_FEAT=$(echo "$COMMITS"    | grep -cE '^feat(\(.+\))?:'     || true)
          HAS_FIX=$(echo "$COMMITS"     | grep -cE '^fix(\(.+\))?:'      || true)
          echo "Commits since ${LATEST_TAG} — breaking=$HAS_BREAKING feat=$HAS_FEAT fix=$HAS_FIX"

          # ── Compute next version (matches release-please observed behaviour) ──
          # Pre-1.0 with bump-minor-pre-major: breaking → minor, feat → minor, fix → patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          if [ "$MAJOR" -eq 0 ]; then
            if [ "$HAS_BREAKING" -gt 0 ] || [ "$HAS_FEAT" -gt 0 ]; then
              MINOR=$((MINOR + 1)); PATCH=0            # breaking or feat → minor
            else
              PATCH=$((PATCH + 1))                     # fix only → patch
            fi
          else
            if [ "$HAS_BREAKING" -gt 0 ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0   # breaking → major
            elif [ "$HAS_FEAT" -gt 0 ]; then
              MINOR=$((MINOR + 1)); PATCH=0             # feat → minor
            else
              PATCH=$((PATCH + 1))                      # fix → patch
            fi
          fi
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="dev-${VERSION}-rc.${{ github.run_number }}"

          echo "Next version: $VERSION (from $LATEST_VERSION)"
          echo "Pre-release tag: $TAG"

          # Safety: fail if this exact tag already exists
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build-prerelease:
    name: Build pre-release
    needs: pre-release
    if: needs.pre-release.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.pre-release.outputs.tag }}
      prerelease: true
    permissions:
      contents: write
    secrets: inherit
