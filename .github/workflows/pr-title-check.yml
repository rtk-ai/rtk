name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [master, develop]

permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            perf
            test
            build
            style
          requireScope: false
