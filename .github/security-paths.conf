# Git pathspecs that must reach the security scan even when the build gate
# skips them.
#
# Read by .github/scripts/load-pathspecs.sh from ci.yml. These are positive
# pathspecs, the opposite sense of inert-paths.conf.
#
# .claude/hooks/ holds shell scripts Claude Code executes on contributors'
# machines. They are not build inputs, so the Rust pipeline has nothing to say
# about them, but semgrep is Rust-only and the security job's shell diff scan
# is the only automated look they get.
#
# The other .claude/ subtrees excluded in inert-paths.conf -- rules/, skills/,
# agents/, commands/ -- are deliberately not listed. They are agent instructions
# in markdown, and nothing in the security job can read them: its pattern scans
# cover Rust and shell only. Routing them here would spend CI to produce no
# signal. Add them the day there is a check that can actually review them.
#
# Comments must be on their own line; a trailing one becomes part of the
# pathspec.

:(top).claude/hooks/
