# Git pathspecs for paths that cannot change the compiled binary or CI.
#
# Read by .github/scripts/load-pathspecs.sh, which serves changed-scope.sh and
# check-embed-scope.sh.
#
# Inverted on purpose: these are subtracted from the changed-file list and a
# build is skipped only when nothing survives, so anything not listed builds.
#
# `,top` anchors each pathspec to the repo root; pathspecs are otherwise
# relative to the working directory.
#
# `,glob` stops `*` at `/`. Without it a bare `*.md` also swallows
# hooks/claude/rtk-awareness.md, which rustc embeds via include_str!, and a
# docs commit ships a stale binary. check-embed-scope.sh fails on that.
#
# .claude/hooks/ is listed here because its shell scripts are not build inputs,
# but they still reach the security job through .github/security-paths.conf.
#
# Do NOT list hooks/, src/ or LICENSE. src/hooks/init.rs embeds ten files from
# hooks/, six of them .md; build.rs concatenates src/filters/*.toml; and
# Cargo.toml's [package.metadata.deb] license-file ships LICENSE in the .deb.
#
# Comments must be on their own line; a trailing one becomes part of the
# pathspec.

:(exclude,top)docs/
:(exclude,top,glob)*.md
:(exclude,top).claude/rules/
:(exclude,top).claude/skills/
:(exclude,top).claude/agents/
:(exclude,top).claude/commands/
:(exclude,top).claude/hooks/
:(exclude,top,glob).github/**/*.md
:(exclude,top)Formula/
