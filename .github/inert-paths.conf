# Git pathspecs for paths that cannot change the compiled binary or CI.
#
# Read by load_pathspecs in .github/scripts/scope-lib.sh, which serves
# changed-scope.sh and check-embed-scope.sh.
#
# Inverted on purpose: these are subtracted from the changed-file list and a
# build is skipped only when nothing survives, so anything not listed builds.
#
# `,top` anchors each pathspec to the repo root; pathspecs are otherwise
# relative to the working directory.
#
# `,glob` stops `*` at `/`. Without it a bare `*.md` also swallows
# hooks/claude/rtk-awareness.md, which rustc embeds via include_str!, and a
# docs commit ships a stale binary. check-embed-scope.sh fails on that.
#
# check-embed-scope.sh only sees embeds, not files a test reads at runtime.
# tests/hook_decision_protocol_test.rs runs .claude/hooks/rtk-rewrite.sh, so
# .claude/hooks/ stays off this list.
#
# Do NOT list hooks/, src/ or LICENSE. src/hooks/init/ embeds files from hooks/,
# .md ones included; build.rs concatenates src/filters/*.toml; and
# Cargo.toml's [package.metadata.deb] license-file ships LICENSE in the .deb.
#
# docs/ is listed piecemeal because tests embed guide pages to check their
# examples: engine/tests/guide_examples.rs reads docs/guide/pipelines/ and
# docs/guide/proxy/, tests/agent_coverage_doc_test.rs docs/guide/resources/.
# A pathspec cannot re-include, so those directories stay off this list.
#
# Comments must be on their own line; a trailing one becomes part of the
# pathspec.

:(exclude,top)docs/contributing/
:(exclude,top)docs/maintainers/
:(exclude,top)docs/usage/
:(exclude,top)docs/TELEMETRY.md
:(exclude,top,glob)docs/guide/*.md
:(exclude,top)docs/guide/analytics/
:(exclude,top)docs/guide/getting-started/
:(exclude,top,glob)*.md
:(exclude,top).claude/rules/
:(exclude,top).claude/skills/
:(exclude,top).claude/agents/
:(exclude,top).claude/commands/
:(exclude,top,glob).github/**/*.md
:(exclude,top)Formula/
