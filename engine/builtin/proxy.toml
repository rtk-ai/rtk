# rtk:proxy — cache alignment in the daemon
#
# Adds an ephemeral cache breakpoint when the client set none. Stripping of
# ANSI codes, progress bars and repeated lines is inherited from rtk:default.
# CCR (reversible compress-cache-retrieve) and write-body retirement are not
# enabled here.
#
# Benchmark: not published.

schema_version = 1

[pipeline]
name    = "rtk:proxy"
extends = "rtk:default"

[[proxy.request.cache]]
name = "align"
use  = ["cache-align"]
