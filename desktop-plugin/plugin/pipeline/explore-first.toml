action  = "deny"
message = '''RTK: three calls into investigation. Hand it to the Explore sub-agent (Agent tool: subagent_type "Explore", model "haiku") with one precise question built from the task, and ask for a compact report: findings first, then only the file paths, line numbers and exact lines you will need, never whole files. Work from its report and do not repeat its searches; if a fact is missing, ask Explore again. If the change is small (roughly under 150 lines), write it yourself and do not start another sub-agent. Otherwise do not write the code yourself: hand the implementation to a general-purpose sub-agent on the sonnet model (Agent tool: subagent_type "general-purpose", model "sonnet") with the task, the Explore report and the files to create or change, a brief of what and where in under 200 words, never the code. Tell it to change only those files, to leave every existing file, test and project directory as it found them (build and test in a scratch copy if it needs to), and to run the tests before it reports. Keep for yourself only what needs your judgment: that brief, running the tests or the result once, and reading its diff (git diff, or the changed ranges) against the task. Do not rewrite what works, do not widen the task beyond what was asked; fix only what its tests missed.'''

