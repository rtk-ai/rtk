[[hook.before_tool.read]]
name    = "outline-first"
when    = { file_lines_gt = 600, whole_file = true }
action  = "deny"
message = '''${file_path} is ${file_lines} lines. Get its outline first: rtk read --max-lines 120 ${file_path} (imports and every signature, in file order), then Read only the ranges you need (offset and limit, at most 200 lines each).'''


[[hook.after_tool.shell]]
name = "keep-ranged-reads"
when = { command_matches = '\bsed -n *.?[0-9]+,[0-9]+p|\b(grep|egrep|rg)\b[^|;&]* -[A-Za-z]*n', is_rtk_command = false }
use  = ["ansi"]

[[directive]]
name = "explore-first"
text = """
RTK may refuse a search or a whole-file read once you are three calls into investigating: it then asks you to hand the investigation to the Explore sub-agent on haiku and, for new code over roughly 150 lines, the implementation to a general-purpose sub-agent on sonnet. Write smaller changes yourself. Give Explore one precise question and ask for a compact report (findings, then file paths, line numbers and exact lines, never whole files). Give the implementer the task, that report and the files to create or change, never the code; tell it to leave every other existing file and test as it found them and to run the tests. Then run the tests once and read its diff; do not redo its work, widen the task, or repeat Explore's searches. For a file over 600 lines, rtk read --max-lines 120 <file> gives the outline; then read ranges.
"""
