# explore-first — delegate discovery to Haiku and bulk writing to Sonnet, decided by what the
# agent does, not by a classifier.
#
# Draft (not benchmarked). Needs nothing but rtk and Claude Code: no Laya, no API key, no proxy.

schema_version = 1

[pipeline]
name    = "explore-first"
extends = "rtk:posthook"


[[hook.before_tool.shell]]
name    = "write-shaped"
when    = { command_matches = '(^|[^2&])>|<<|^rtk\b|\b(mkdir|cp|mv|rm|rmdir|touch|chmod|chown|ln|tee|patch|install|pip3? (install|uninstall)|npm (i|install|ci|uninstall|run)|pnpm (i|install|add)|yarn( add| install)?|cargo (build|run|add|install)|make|apt(-get)?|brew|sed -i|perl -pi|git (add|commit|checkout|switch|stash|apply|push|pull|merge|rebase|reset|rm|mv|clean|tag|init|clone))\b' }
action  = "rewrite"

[[hook.before_tool.shell]]
name    = "gate-fix"
when    = { goal_matches = '(?i)\b(fix|bug|debug|broken|fail(s|ed|ing|ure)?|crash|regression|vulnerab|cve|exploit|slow|leak|flaky|incorrect|wrong|not work|does ?n.t work)', recent_calls_matches = '^(Bash \(? *((cd [^;&|>]+|[A-Za-z_][A-Za-z0-9_]*=[^;&|> ]*|export [A-Za-z_][A-Za-z0-9_]*=[^;&|> ]*|test [^;&|>]+|\[ [^;&|>]+ \])(;|&&) *)*(ls|cat|head|tail|less|nl|grep|rg|find|tree|wc|file|stat|du|pwd|diff|which|type|env|printenv|nproc|uname|pip (show|list|freeze)|sed -n|git (log|status|show|diff|branch|grep|blame)|for\b)\b([^|>]|2>|&?>/dev/null)*((\|\||\| ?[^A-Z |>])([^|>]|2>|&?>/dev/null)*)*|(Read|Grep|Glob) ([^|>]|2>|&?>/dev/null)*((\|\||\| ?[^A-Z |>])([^|>]|2>|&?>/dev/null)*)*) \| (Bash \(? *((cd [^;&|>]+|[A-Za-z_][A-Za-z0-9_]*=[^;&|> ]*|export [A-Za-z_][A-Za-z0-9_]*=[^;&|> ]*|test [^;&|>]+|\[ [^;&|>]+ \])(;|&&) *)*(ls|cat|head|tail|less|nl|grep|rg|find|tree|wc|file|stat|du|pwd|diff|which|type|env|printenv|nproc|uname|pip (show|list|freeze)|sed -n|git (log|status|show|diff|branch|grep|blame)|for\b)\b([^|>]|2>|&?>/dev/null)*((\|\||\| ?[^A-Z |>])([^|>]|2>|&?>/dev/null)*)*|(Read|Grep|Glob) ([^|>]|2>|&?>/dev/null)*((\|\||\| ?[^A-Z |>])([^|>]|2>|&?>/dev/null)*)*)( \| (Bash|Read|Grep|Glob|WebFetch|WebSearch|TodoWrite|Skill|LSP|Monitor) ([^|>]|2>|&?>/dev/null)*((\|\||\| ?[^A-Z |>])([^|>]|2>|&?>/dev/null)*)*){0,3}$' }
action  = "deny"
message = '''RTK: three calls into investigation. Hand it to the Explore sub-agent (Agent tool: subagent_type "Explore", model "haiku") with one precise question built from the task, and ask for a compact report: findings first, then only the file paths, line numbers and exact lines you will need, never whole files. Work from its report and do not repeat its searches; if a fact is missing, ask Explore again. Read the exact ranges with Read (offset and limit; a ranged read is never refused), make the fix yourself and run the tests. Hand the implementation to a general-purpose sub-agent on the sonnet model only if it is mechanical or spans many files, and then check its diff.'''

