[filters.pip-install]
description = "Compact pip install output — strip downloads, progress bars, and metadata"
match_command = "^pip3?\\s+install\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Downloading ",
  "^\\s*Using cached ",
  "^\\s*━+",
  "^\\s*Collecting ",
  "^\\s*Preparing metadata",
  "^\\s*Building wheel",
  "^\\s*Created wheel",
  "^\\s*Stored in directory",
  "^\\[notice\\]",
]
match_output = [
  { pattern = "already satisfied", message = "ok (already installed)", unless = "ERROR|error:" },
]
max_lines = 30

[[tests.pip-install]]
name = "already installed short-circuits"
input = """
Requirement already satisfied: requests in /usr/lib/python3/dist-packages (2.28.1)
Requirement already satisfied: urllib3 in /usr/lib/python3/dist-packages (1.26.15)
"""
expected = "ok (already installed)"

[[tests.pip-install]]
name = "install strips download lines"
input = """
Collecting requests
  Downloading requests-2.31.0-py3-none-any.whl (62 kB)
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ 62.6/62.6 kB 1.2 MB/s eta 0:00:00
Collecting urllib3<3,>=1.21.1
  Downloading urllib3-2.1.0-py3-none-any.whl (104 kB)
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ 104.6/104.6 kB 2.1 MB/s eta 0:00:00
Installing collected packages: urllib3, requests
Successfully installed requests-2.31.0 urllib3-2.1.0
"""
expected = "Installing collected packages: urllib3, requests\nSuccessfully installed requests-2.31.0 urllib3-2.1.0"

[[tests.pip-install]]
name = "errors are not short-circuited"
input = """
Requirement already satisfied: requests in /usr/lib/python3/dist-packages (2.28.1)
ERROR: Could not install packages due to an OSError
"""
expected = "Requirement already satisfied: requests in /usr/lib/python3/dist-packages (2.28.1)\nERROR: Could not install packages due to an OSError"
