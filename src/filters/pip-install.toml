[filters.pip-install]
description = "Strip pip install progress bars and download noise"
match_command = "^(pip3?|python3?\\s+-m\\s+pip)\\s+install\\b"
strip_ansi = true
strip_lines_matching = [
    "^\\s*$",
    "^\\s*━",
    "^\\s*\\|.*\\d+\\.\\d+\\s+[MkG]B",
    "^Downloading ",
    "^\\s+Downloading ",
    "^Using cached ",
    "^\\s+Using cached ",
    "^Collecting ",
    "^  Downloading ",
    "^  Using cached ",
    "^Requirement already satisfied",
    "^\\[notice\\]",
    "^WARNING: You are using pip version",
    "^WARNING: There is a new pip version",
]
match_output = [
    { pattern = "Requirement already satisfied", message = "ok (already installed)" },
]
truncate_lines_at = 120
max_lines = 30

[[tests.pip-install]]
name = "strips progress bars and download noise"
input = """
Collecting requests
  Downloading requests-2.31.0-py3-none-any.whl (62.6 kB)
     ━━━━━━━━━━━━━━━━━━━━ 62.6/62.6 kB 1.2 MB/s eta 0:00:00
Collecting certifi>=2017.4.17
  Using cached certifi-2023.11.17-py3-none-any.whl (162 kB)
Collecting charset-normalizer<4,>=2
  Downloading charset_normalizer-3.3.2-cp312-cp312-macosx_11_0_arm64.whl (119 kB)
     ━━━━━━━━━━━━━━━━━━━━ 119.1/119.1 kB 2.1 MB/s eta 0:00:00
Installing collected packages: certifi, charset-normalizer, idna, urllib3, requests
Successfully installed certifi-2023.11.17 charset-normalizer-3.3.2 idna-3.6 requests-2.31.0 urllib3-2.1.0
"""
expected = "Installing collected packages: certifi, charset-normalizer, idna, urllib3, requests\nSuccessfully installed certifi-2023.11.17 charset-normalizer-3.3.2 idna-3.6 requests-2.31.0 urllib3-2.1.0"

[[tests.pip-install]]
name = "already installed short-circuits"
input = """
Requirement already satisfied: requests in ./venv/lib/python3.12/site-packages (2.31.0)
Requirement already satisfied: certifi>=2017.4.17 in ./venv/lib/python3.12/site-packages (2023.11.17)
"""
expected = "ok (already installed)"

[[tests.pip-install]]
name = "strips pip version warnings"
input = """
Installing collected packages: flask
Successfully installed flask-3.0.0
WARNING: You are using pip version 23.2.1; however, version 24.0 is available.
WARNING: There is a new pip version available: 24.0
[notice] A new release of pip is available: 23.2.1 -> 24.0
"""
expected = "Installing collected packages: flask\nSuccessfully installed flask-3.0.0"
