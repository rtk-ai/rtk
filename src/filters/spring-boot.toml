[filters.spring-boot]
description = "Strip recognizable Spring Boot banner lines without discarding application output or diagnostics. Matches gradle bootRun and java -jar when the jar filename contains spring; the filename is only a heuristic, so unknown output is preserved. Maven uses RTK's dedicated Maven filter."
match_command = "^(mvn\\s+spring-boot:run|java\\s+-jar\\s+(?:\\S*[/\\\\])?[^/\\\\\\s]*(?i:spring)[^/\\\\\\s]*\\.jar|gradle\\s+.*bootRun)"
strip_ansi = true
# A keep-list also deletes batch reports and unrelated jars whose names contain
# spring (#3771). Remove only known decoration, never arbitrary INFO messages.
# Do not head-cap: the application result or root cause may be the final line.
strip_lines_matching = [
  "^\\s*\\.   ____          _\\s*$",
  "^\\s*/\\\\\\\\ / ___'_ __ _ _\\(_\\)_ __\\s*$",
  "^\\s*\\( \\( \\)\\\\___ \\| '_ \\| '_\\| \\| '_ \\\\\\s*$",
  "^\\s*\\\\/  ___\\)\\| \\|_\\)\\| \\| \\| \\| \\| \\|\\| \\)\\s*$",
  "^\\s*'  \\|____\\| \\.__\\|_\\| \\|_\\|_\\| \\|_\\\\__\\|\\s*$",
  "^\\s*:: Spring Boot ::\\s*(?:\\(v[^\\r\\n)]*\\))?\\s*$",
]

[[tests.spring-boot]]
name = "strips the banner but preserves startup messages"
input = "  .   ____          _ \n /\\\\ / ___'_ __ _ _(_)_ __  \n( ( )\\___ | '_ | '_| | '_ \\ \n \\/  ___)| |_)| | | | | || )\n  '  |____| .__|_| |_|_| |_\\__|\n  :: Spring Boot ::  (v3.2.0)\n2024-01-01 INFO Initializing Spring\n2024-01-01 INFO Bean 'dataSource' created\n2024-01-01 INFO Tomcat started on port 8080\n2024-01-01 INFO Started MyApp in 3.2 seconds"
expected = "2024-01-01 INFO Initializing Spring\n2024-01-01 INFO Bean 'dataSource' created\n2024-01-01 INFO Tomcat started on port 8080\n2024-01-01 INFO Started MyApp in 3.2 seconds"

[[tests.spring-boot]]
name = "preserves complete diagnostics"
input = "  :: Spring Boot ::  (v3.2.0)\n2024-01-01 INFO Initializing Spring\n2024-01-01 ERROR Application run failed\nCaused by: java.lang.NullPointerException"
expected = "2024-01-01 INFO Initializing Spring\n2024-01-01 ERROR Application run failed\nCaused by: java.lang.NullPointerException"

[[tests.spring-boot]]
name = "preserves batch results after startup"
input = "2024-01-01 INFO Started BatchApp in 2.1 seconds\nReconciliation report:\naccounts scanned : 41822\nmismatches : 3\nids: 90412, 90855, 91003\nBatch complete."
expected = "2024-01-01 INFO Started BatchApp in 2.1 seconds\nReconciliation report:\naccounts scanned : 41822\nmismatches : 3\nids: 90412, 90855, 91003\nBatch complete."

[[tests.spring-boot]]
name = "preserves unrelated CLI output"
input = "Generating from spec.yaml\nWrote 12 files to ./out\n  model/User.java\n  model/Order.java\n  api/DefaultApi.java\nSummary: 12 created, 0 skipped\nDone in 1.4s"
expected = "Generating from spec.yaml\nWrote 12 files to ./out\n  model/User.java\n  model/Order.java\n  api/DefaultApi.java\nSummary: 12 created, 0 skipped\nDone in 1.4s"

[[tests.spring-boot]]
name = "preserves stack frames and the root cause"
input = "2024-01-01 ERROR Application run failed\njava.lang.IllegalStateException: failed\n    at demo.Application.main(Application.java:21)\nCaused by: java.io.IOException: missing config\n    at demo.Config.load(Config.java:10)\n    ... 12 more"
expected = "2024-01-01 ERROR Application run failed\njava.lang.IllegalStateException: failed\n    at demo.Application.main(Application.java:21)\nCaused by: java.io.IOException: missing config\n    at demo.Config.load(Config.java:10)\n    ... 12 more"

