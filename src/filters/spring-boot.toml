[[tests.spring-boot]]
name = "does not strip incidental banner text or business INFO"
input = "Custom banner: Spring Boot :: report\nINFO Account 812 failed reconciliation\n  :: Spring Boot :: is a literal in this report"
expected = "Custom banner: Spring Boot :: report\nINFO Account 812 failed reconciliation\n  :: Spring Boot :: is a literal in this report"

[[tests.spring-boot]]
name = "empty output stays empty"
input = ""
