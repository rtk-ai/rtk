[INFO] -------------------------------------------------------
[INFO]  T E S T S
[INFO] -------------------------------------------------------
[INFO] Running com.example.CalculatorTest
[INFO] Tests run: 3, Failures: 0, Errors: 0, Skipped: 0, Time elapsed: 0.123 s -- in com.example.CalculatorTest
[INFO] BUILD SUCCESS
[INFO] Total time: 1.234 s
[INFO] Finished at: 2026-05-16T10:30:00+02:00
"""
expected = "[INFO] BUILD SUCCESS\n[INFO] Total time: 1.234 s\n[INFO] Finished at: 2026-05-16T10:30:00+02:00"

[[tests.mvn-test]]
name = "preserves test compilation errors"
input = """
[INFO] --- maven-compiler-plugin:3.11.0:testCompile (default-testCompile) @ app ---
