[filters.mvn-build]
description = "Compact Maven build output"
# Match Maven build goals while excluding any invocation that also carries a
# bare `test` goal (those belong to mvn-test). Filters are loaded in alphabetical
# order and find_filter_in is first-match-wins, so `mvn-build` is checked before
# `mvn-test`; we must therefore reject `mvn clean test` here even though `clean`
# is in the build alternation.
#
# The `regex` crate has no lookahead, so "not exactly `test`" is enumerated as:
#   t | te | tes                            — shorter prefixes of `test`
#   [^t\s]\S*                               — token not starting with `t`
#   t[^e\s]\S*, te[^s\s]\S*, tes[^t\s]\S*   — token diverging from `test` at
#                                             position 2, 3, or 4
#   test\S+                                 — token starting with `test` plus
#                                             more chars (e.g. `testCompile`)
# The block is applied to every space-separated token before and after the
# captured build goal.
match_command = "^mvn(?:\\s+(?:t|te|tes|[^t\\s]\\S*|t[^e\\s]\\S*|te[^s\\s]\\S*|tes[^t\\s]\\S*|test\\S+))*\\s+(compile|package|clean|install)\\b(?:\\s+(?:t|te|tes|[^t\\s]\\S*|t[^e\\s]\\S*|te[^s\\s]\\S*|tes[^t\\s]\\S*|test\\S+))*$"
strip_ansi = true
strip_lines_matching = [
  "^\\[INFO\\] ---",
  "^\\[INFO\\] Building\\s",
  "^\\[INFO\\] Downloading\\s",
  "^\\[INFO\\] Downloaded\\s",
  "^\\[INFO\\]\\s*$",
  "^\\s*$",
  "^Downloading:",
  "^Downloaded:",
  "^Progress",
]
max_lines = 50
on_empty = "mvn: ok"

[[tests.mvn-build]]
name = "strips INFO noise, preserves errors and summary"
input = """
[INFO] ---
[INFO] Building myapp 1.0-SNAPSHOT
[INFO] Downloading org.apache.maven.plugins:maven-compiler-plugin:3.11.0
[INFO] Downloaded org.apache.maven.plugins:maven-compiler-plugin:3.11.0
[INFO]
[ERROR] /src/main/java/Main.java:[10,5] cannot find symbol
  symbol: method foo()
[INFO] BUILD FAILURE
[INFO] Total time: 2.543 s
"""
expected = "[ERROR] /src/main/java/Main.java:[10,5] cannot find symbol\n  symbol: method foo()\n[INFO] BUILD FAILURE\n[INFO] Total time: 2.543 s"

[[tests.mvn-build]]
name = "successful build keeps BUILD SUCCESS line"
input = """
[INFO] ---
[INFO] Building myapp 1.0-SNAPSHOT
[INFO]
[INFO] BUILD SUCCESS
[INFO] Total time: 4.123 s
[INFO] Finished at: 2024-01-15T10:30:00Z
"""
expected = "[INFO] BUILD SUCCESS\n[INFO] Total time: 4.123 s\n[INFO] Finished at: 2024-01-15T10:30:00Z"
