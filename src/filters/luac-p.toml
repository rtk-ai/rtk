[filters.luac-p]
description = "Collapse repeated lines in luac -p syntax check output"
match_command = "^luac[0-9.]*\\s+(-\\S+\\s+)*-p\\b"
collapse_repeats = { keep_tail = 5 }

[[tests.luac-p]]
name = "syntax error passes through unchanged"
input = "luac: parser.lua:12: '=' expected near 'then'"
expected = "luac: parser.lua:12: '=' expected near 'then'"

[[tests.luac-p]]
name = "empty input passes through"
input = ""
expected = ""
