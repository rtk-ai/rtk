[filters.bitbake]
description = "Compact Yocto BitBake output — strip per-task progress, cache/parse chatter and the Build Configuration block, keep ERROR/WARNING, failed-task logs and summaries"
match_command = "^bitbake(?:\\s|$)"
strip_ansi = true
# Known noise only: any line not listed here survives, including every NOTE not listed,
# so -e, -s, -g and -c listtasks output passes through almost untouched.
# stderr is left unfiltered: knotty writes only the first line of each WARNING/ERROR there.
strip_lines_matching = [
  "^NOTE: Running (?:setscene |noexec )?task \\d+ of \\d+ \\(",
  "^NOTE: recipe \\S+: task \\S+: (?:Started|Succeeded)$",
  "^NOTE: (?:Executing (?:SetScene )?Tasks|Resolving any missing task queue dependencies|Setscene tasks completed)$",
  "^NOTE: Fetching uninative binary shim ",
  "^(?:Loading cache\\.\\.\\.|Loaded \\d+ entries from dependency cache\\.|Parsing recipes\\.\\.\\.|Parsing of \\d+ \\.bb files complete|Initialising tasks\\.\\.\\.|Checking sstate mirror object availability\\.\\.\\.|Sstate summary: )",
  "^done\\.$",
  "^Build Configuration:$",
  "^[A-Z][A-Z0-9_]*\\s+= \".*\"$",
  "^(?:meta[\\w-]*|workspace)\\s*(?:= \"[^\"]*\")?$",
  "^\\s*$",
]
on_empty = "bitbake: ok"

