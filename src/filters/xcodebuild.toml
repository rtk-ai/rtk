[filters.xcodebuild]
description = "Compact xcodebuild output — keep errors, failed tests and the result summary"
match_command = "^xcodebuild\\b.*\\s(build|test|archive|analyze|clean|build-for-testing|test-without-building|docbuild)(\\s|$)"
strip_ansi = true
keep_lines_matching = [
  "^\\*\\* .+ \\*\\*$",
  ":\\d+(:\\d+)?: (fatal )?error: ",
  "^(\\S+: )?(fatal )?error: ",
  "^ld: .*not found",
  "^Undefined symbols for architecture ",
  "^\\s+\"[^\"]+\", referenced from:$",
  "^Command \\S+ failed with a nonzero exit code",
  "^The following build commands failed:",
  "^(Failing tests|Testing failed):",
  "^\\t+\\S",
  "^\\(\\d+ failures?\\)$",
  "^Test [Cc]ase '.+' failed",
  "Executed \\d+ tests?, with [1-9]\\d* failures?",
]
max_lines = 60
on_empty = "xcodebuild: no errors and no result line in output"

