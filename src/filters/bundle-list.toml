[filters.bundle-list]
description = "Compact bundle list: strip header, truncate long lists"
match_command = "^bundle\\s+list"
strip_lines_matching = [
  "^\\s*$",
  "^Gems included by the bundle:",
]
truncate_lines_at = 120
head_lines = 30

[[tests.bundle-list]]
name = "strips header and blank lines, keeps gems"
input = """
Gems included by the bundle:
  * actioncable (7.1.3)
  * actionmailbox (7.1.3)
  * rails (7.1.3)
"""
expected = """
  * actioncable (7.1.3)
  * actionmailbox (7.1.3)
  * rails (7.1.3)
"""

